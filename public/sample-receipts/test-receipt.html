<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: white; 
            width: 300px;
        }
        .receipt { 
            border: 1px solid #ccc; 
            padding: 15px; 
            background: white; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 15px; 
        }
        .company { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }
        .address { 
            font-size: 12px; 
            color: #666; 
            margin-bottom: 10px; 
        }
        .receipt-number { 
            font-size: 12px; 
            margin-bottom: 10px; 
        }
        .date { 
            font-size: 12px; 
            margin-bottom: 15px; 
        }
        .table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 15px; 
        }
        .table th, .table td { 
            padding: 5px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }
        .table th { 
            background: #f5f5f5; 
            font-weight: bold; 
            font-size: 11px; 
        }
        .total { 
            font-size: 14px; 
            font-weight: bold; 
            text-align: right; 
            margin-top: 10px; 
        }
        .footer { 
            text-align: center; 
            margin-top: 15px; 
            font-size: 11px; 
            color: #666; 
        }
    </style>
</head>
<body>
    <div class="receipt">
        <div class="header">
            <div class="company">Sample Restaurant</div>
            <div class="address">123 Main Street<br>City, State 12345<br>Phone: (555) 123-4567</div>
        </div>
        
        <div class="receipt-number"><strong>Receipt #:</strong> SR-2025-001</div>
        <div class="date"><strong>Date:</strong> 2025-01-15</div>
        
        <table class="table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Sample Item 1</td>
                    <td>1</td>
                    <td>12.99</td>
                </tr>
                <tr>
                    <td>Sample Item 2</td>
                    <td>2</td>
                    <td>8.50</td>
                </tr>
            </tbody>
        </table>
        
        <div class="total">TOTAL: $29.99</div>
        
        <div class="footer">Thank you for your business!</div>
    </div>
</body>
</html>
